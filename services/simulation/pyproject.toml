[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veinguard-sim"
version = "0.1.0"
description = "VeinGuard scientific simulation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.1,<1",
  "uvicorn[standard]>=0.35.0,<1",
  "pydantic-settings>=2.10.1,<3",
  "python-dotenv>=1.1.1,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.17.1,<2",
  "pytest>=8.4.1,<9",
  "ruff>=0.12.8,<1",
]

[tool.setuptools.packages.find]
include = ["veinguard_sim*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
